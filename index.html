<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interactive Video Editor</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1d21;--mu:#6b7280;--bd:#dfe3e8;--ac:#e5322d;--ac2:#2563eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121316;--card:#1c1e23;--tx:#eceef1;--mu:#9aa1ad;--bd:#32353c;--ac2:#5b8cff}}
:root[data-theme="dark"]{--bg:#121316;--card:#1c1e23;--tx:#eceef1;--mu:#9aa1ad;--bd:#32353c;--ac2:#5b8cff}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:10px;max-width:640px;margin-inline:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:0 0 8px}
input,select,button,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
label{display:block;font-size:12px;color:var(--mu);margin:6px 0 2px}
button{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:9px 6px;cursor:pointer;min-height:40px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.s{background:var(--ac2);border-color:var(--ac2);color:#fff}
.row{display:flex;gap:6px;align-items:flex-end}.row>*{flex:1}.row>button{flex:0 0 auto}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;font-weight:600}.tabs .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.vid{position:relative;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.bar{position:relative;margin-top:10px;height:44px}
.bar input[type=range]{position:absolute;inset:0;width:100%;height:44px;margin:0;padding:0;background:transparent;touch-action:none;-webkit-appearance:none;appearance:none;z-index:2}
.bar input[type=range]::-webkit-slider-runnable-track{height:14px;background:var(--bd);border-radius:7px}
.bar input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:34px;margin-top:-10px;border-radius:8px;background:var(--ac);border:2px solid #fff}
.bar input[type=range]::-moz-range-track{height:14px;background:var(--bd);border-radius:7px}
.bar input[type=range]::-moz-range-thumb{width:22px;height:30px;border-radius:8px;background:var(--ac);border:2px solid #fff}
.mk{position:absolute;top:15px;height:14px;border-radius:3px;z-index:1;min-width:3px;opacity:.9}
.time{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;font-size:13px;margin-top:2px}
.item{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--bd);border-radius:8px;margin-top:6px;font-size:13px}
.item b{flex:1;cursor:pointer}.item button{flex:0 0 auto;min-height:32px;padding:4px 10px}
.hint{font-size:12px;color:var(--mu);margin-top:6px}
textarea{height:220px;font:12px/1.4 ui-monospace,Menlo,monospace}
.hide{display:none}
</style>
</head>
<body>
<div class="tabs"><button id="tGame" class="on">🎮 Game</button><button id="tRun">🏃 Virtual run</button></div>

<div class="card">
  <h2>Video</h2>
  <div class="row"><div><label>YouTube URL</label><input id="url" type="url" placeholder="https://youtu.be/..."></div><button class="p" id="load">Load</button></div>
  <label>Title</label><input id="title">
  <div id="gameMeta" class="row"><div><label>Level</label><select id="level"><option value="">–</option><option>easy</option><option>medium</option><option>hard</option><option>expert</option></select></div><div><label>Genre</label><input id="genre" placeholder="runner, action…"></div></div>
  <div id="runMeta" class="hide"><label>Type of place</label><input id="place" list="places" placeholder="jungle, beach, street…"><datalist id="places"><option>jungle<option>beach<option>street<option>mountain<option>forest<option>city<option>desert<option>park</datalist></div>
  <label>Duration (seconds, auto-detected)</label><input id="dur" type="number" min="0" step="0.1">
</div>

<div class="card">
  <h2>Player &amp; seek bar</h2>
  <div class="vid"><div id="ph" style="color:#aaa;display:grid;place-items:center;height:100%">Paste a link and tap Load</div></div>
  <div class="bar"><div id="mks"></div><input id="seek" type="range" min="0" max="100" step="0.1" value="0"></div>
  <div class="time"><span id="cur">0:00</span><span id="tot">0:00</span></div>
  <div class="grid">
    <button data-s="-60">−1m</button><button data-s="-30">−30s</button><button data-s="-5">−5s</button><button data-s="-1">−1s</button>
    <button data-s="1">+1s</button><button data-s="5">+5s</button><button data-s="30">+30s</button><button data-s="60">+1m</button>
  </div>
  <div class="row" style="margin-top:8px"><button id="play">▶ Play</button><button id="pause">⏸ Pause</button></div>
  <div class="hint">Drag the bar with your finger. Colored blocks show your actions; use “now” buttons to grab the current time.</div>
</div>

<div class="card">
  <h2>Video time edit</h2>
  <div class="row"><div><label>Start at</label><input id="vs" type="number" min="0" step="0.1"></div><button data-now="vs">now</button><div><label>End at</label><input id="ve" type="number" min="0" step="0.1"></div><button data-now="ve">now</button></div>
  <label>Jump from time → to time</label>
  <div class="row"><input id="jf" type="number" step="0.1" placeholder="from"><button data-now="jf">now</button><input id="jt" type="number" step="0.1" placeholder="to"><button data-now="jt">now</button><button class="s" id="addJ">+</button></div>
  <div id="jl"></div>
</div>

<div id="actCard" class="card">
  <h2>Actions (game)</h2>
  <div class="row"><div><label>Action</label><select id="at"><option>jump<option>go right<option>go left<option>go down<option>slide<option>punch<option>clap<option value="__c">custom…</option></select></div><div id="cw" class="hide"><label>Custom name</label><input id="cn"></div></div>
  <div class="row"><div><label>Start (s)</label><input id="as" type="number" min="0" step="0.1"></div><button data-now="as">now</button><div><label>Duration (s)</label><input id="ad" type="number" min="0" step="0.1" value="1"></div></div>
  <div class="row"><div><label>If done → go to (s)</label><input id="ok" type="number" step="0.1" placeholder="optional"></div><button data-now="ok">now</button></div>
  <div class="row"><div><label>If fail → go to (s)</label><input id="ko" type="number" step="0.1" placeholder="optional"></div><button data-now="ko">now</button></div>
  <button class="s" id="addA" style="width:100%;margin-top:8px">+ Add action</button>
  <div id="al"></div>
</div>

<div class="card">
  <h2>JSON output</h2>
  <textarea id="out" readonly></textarea>
  <div class="row" style="margin-top:8px"><button class="p" id="copy">Copy JSON</button></div>
  <div class="hint" id="msg"></div>
</div>

<script>
var $=function(i){return document.getElementById(i)};
var S={mode:"game",actions:[],jumps:[],cur:0,id:"",dur:0};
var frame=null,colors={"jump":"#e5322d","go right":"#2563eb","go left":"#7c3aed","go down":"#0d9488","slide":"#d97706","punch":"#be185d","clap":"#16a34a"};
function fmt(t){t=Math.max(0,t||0);var m=Math.floor(t/60),s=Math.floor(t%60);return m+":"+(s<10?"0":"")+s}
function num(i){var v=$(i).value;return v===""?null:parseFloat(v)}
function r1(x){return Math.round(x*10)/10}
function parseId(u){var m=u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/);return m?m[1]:""}
function cmd(f,a){if(frame&&frame.contentWindow)frame.contentWindow.postMessage(JSON.stringify({event:"command",func:f,args:a||[]}),"*")}
function seekTo(t){t=Math.max(0,S.dur?Math.min(t,S.dur):t);S.cur=t;cmd("seekTo",[t,true]);ui()}
function load(){
  var id=parseId($("url").value.trim());
  if(!id){$("msg").textContent="Invalid YouTube link.";return}
  S.id=id;var v=document.querySelector(".vid");v.innerHTML="";
  frame=document.createElement("iframe");
  frame.src="https://www.youtube.com/embed/"+id+"?enablejsapi=1&playsinline=1&rel=0";
  frame.allow="autoplay; encrypted-media; picture-in-picture";frame.allowFullscreen=true;
  frame.onload=function(){var n=0,iv=setInterval(function(){frame.contentWindow.postMessage(JSON.stringify({event:"listening",id:1,channel:"widget"}),"*");if(++n>8)clearInterval(iv)},400)};
  v.appendChild(frame);$("msg").textContent="";
}
window.addEventListener("message",function(e){
  if(!/youtube\.com$/.test(new URL(e.origin).hostname))return;
  var d;try{d=JSON.parse(e.data)}catch(x){return}
  var i=d&&d.info;if(!i)return;
  if(typeof i.duration==="number"&&i.duration>0&&i.duration!==S.dur){S.dur=i.duration;$("dur").value=r1(i.duration)}
  if(typeof i.currentTime==="number"&&!dragging){S.cur=i.currentTime;ui()}
  if(i.videoData&&i.videoData.title&&!$("title").value)$("title").value=i.videoData.title;
});
var dragging=false,lastSeek=0;
function ui(){
  var d=S.dur||num("dur")||0;$("seek").max=d||100;
  if(!dragging)$("seek").value=S.cur;
  $("cur").textContent=fmt(S.cur);$("tot").textContent=fmt(d);
}
function marks(){
  var d=S.dur||num("dur")||0,h="";if(!d)return $("mks").innerHTML="";
  S.actions.forEach(function(a){h+='<div class="mk" style="left:'+(a.start/d*100)+'%;width:'+(Math.max(a.duration,0.5)/d*100)+'%;background:'+(colors[a.action]||"#555")+'"></div>'});
  $("mks").innerHTML=h;
}
function lists(){
  $("al").innerHTML=S.actions.map(function(a,i){return '<div class="item"><b data-go="'+a.start+'">'+a.action+' @ '+fmt(a.start)+' ('+a.duration+'s)'+(a.ok!=null?' ✓→'+fmt(a.ok):'')+(a.ko!=null?' ✗→'+fmt(a.ko):'')+'</b><button data-da="'+i+'">✕</button></div>'}).join("");
  $("jl").innerHTML=S.jumps.map(function(j,i){return '<div class="item"><b data-go="'+j.from+'">'+fmt(j.from)+' → '+fmt(j.to)+'</b><button data-dj="'+i+'">✕</button></div>'}).join("");
  marks();out();
}
function out(){
  var o={type:S.mode==="game"?"game":"virtual_run"};
  var put=function(k,v){if(v!==null&&v!==""&&v!==undefined&&!(typeof v==="number"&&isNaN(v)))o[k]=v};
  put("url",$("url").value.trim());put("title",$("title").value.trim());
  if(S.mode==="game"){put("level",$("level").value);put("genre",$("genre").value.trim())}else put("place",$("place").value.trim());
  put("duration",num("dur"));
  var vs=num("vs"),ve=num("ve");if(vs!==null||ve!==null){o.trim={};if(vs!==null)o.trim.start=vs;if(ve!==null)o.trim.end=ve}
  if(S.jumps.length)o.jumps=S.jumps.map(function(j){return{from:j.from,to:j.to}});
  if(S.mode==="game"&&S.actions.length)o.actions=S.actions.slice().sort(function(a,b){return a.start-b.start}).map(function(a){var x={action:a.action,start:a.start,duration:a.duration};if(a.ok!=null)x.onSuccess={goTo:a.ok};if(a.ko!=null)x.onFail={goTo:a.ko};return x});
  $("out").value=JSON.stringify(o,null,2);
}
function setMode(m){S.mode=m;$("tGame").classList.toggle("on",m==="game");$("tRun").classList.toggle("on",m==="run");
  $("gameMeta").classList.toggle("hide",m!=="game");$("runMeta").classList.toggle("hide",m==="game");$("actCard").classList.toggle("hide",m!=="game");out()}
$("tGame").onclick=function(){setMode("game")};$("tRun").onclick=function(){setMode("run")};
$("load").onclick=load;
$("play").onclick=function(){cmd("playVideo")};$("pause").onclick=function(){cmd("pauseVideo")};
document.querySelectorAll("[data-s]").forEach(function(b){b.onclick=function(){seekTo(S.cur+parseFloat(b.dataset.s))}});
document.querySelectorAll("[data-now]").forEach(function(b){b.onclick=function(){$(b.dataset.now).value=r1(S.cur);out()}});
var sk=$("seek");
sk.addEventListener("input",function(){dragging=true;S.cur=parseFloat(sk.value);$("cur").textContent=fmt(S.cur);var n=Date.now();if(n-lastSeek>150){lastSeek=n;cmd("seekTo",[S.cur,true])}});
sk.addEventListener("change",function(){dragging=false;seekTo(parseFloat(sk.value))});
$("at").onchange=function(){$("cw").classList.toggle("hide",this.value!=="__c")};
$("addA").onclick=function(){
  var t=$("at").value;if(t==="__c")t=$("cn").value.trim();if(!t)return;
  var s=num("as");if(s===null)s=r1(S.cur);
  var d=num("ad");S.actions.push({action:t,start:s,duration:d===null?1:d,ok:num("ok"),ko:num("ko")});
  $("ok").value="";$("ko").value="";lists();
};
$("addJ").onclick=function(){var f=num("jf"),t=num("jt");if(f===null||t===null)return;S.jumps.push({from:f,to:t});$("jf").value="";$("jt").value="";lists()};
document.body.addEventListener("click",function(e){var t=e.target;
  if(t.dataset.go!==undefined)seekTo(parseFloat(t.dataset.go));
  if(t.dataset.da!==undefined){S.actions.splice(+t.dataset.da,1);lists()}
  if(t.dataset.dj!==undefined){S.jumps.splice(+t.dataset.dj,1);lists()}});
document.querySelectorAll("input,select").forEach(function(i){i.addEventListener("input",function(){if(i.id==="dur"){S.dur=num("dur")||0;ui();marks()}out()})});
$("copy").onclick=function(){var t=$("out");t.select();var ok=false;
  try{navigator.clipboard.writeText(t.value);ok=true}catch(e){}
  if(!ok)try{ok=document.execCommand("copy")}catch(e){}
  $("msg").textContent=ok?"Copied ✓":"Select the text above and copy it manually."};
lists();ui();
</script>
</body>
  </html>
